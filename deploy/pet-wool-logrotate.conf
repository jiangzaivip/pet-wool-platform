# The API writes one structured line per request to logs/*.log and had no
# rotation at all: a scanner hammering the site produced 12MB in ~70 minutes and
# nothing ever deleted it (journald was unlimited too). Keep a week, cap size,
# compress, and keep the file non-world-readable: it contains client IPs.
/opt/pet-wool-platform/logs/*.log {
    daily
    rotate 7
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0640 root root
}
