# Managed by pet-wool-platform: deploy/install-nginx.sh
# Source of truth for the woolbuddy.shop vhost. Edit here, then run
#   sudo bash deploy/install-nginx.sh
# on the production host; the script is idempotent and reloads nginx only
# after `nginx -t` passes.
#
# Why this file exists: the vhost previously lived only on the server, so every
# hardening change (gzip_types, HTTP/2, HSTS, CSP, www canonicalization) had to
# be re-applied by hand and silently drifted between hosts.

# www -> apex on 443 so the site has a single canonical origin. Without this,
# both hosts returned 200 with identical content and canonical/link hints were
# split across two origins.
server {
    listen 80;
    listen [::]:80;
    server_name woolbuddy.shop www.woolbuddy.shop;
    return 301 https://woolbuddy.shop$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.woolbuddy.shop;

    ssl_certificate /etc/letsencrypt/live/woolbuddy.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woolbuddy.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://woolbuddy.shop$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name woolbuddy.shop;

    ssl_certificate /etc/letsencrypt/live/woolbuddy.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/woolbuddy.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;
    # Do not advertise the exact nginx build to the internet.
    server_tokens off;

    # HSTS: the checkout is HTTPS-only and there is no plain-HTTP fallback worth
    # preserving, so pin browsers to TLS for a year across subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The storefront is a Vue SPA served by the Node service. script-src needs
    # the PayPal SDK (www.paypal.com) and Google Identity (accounts.google.com).
    # 'unsafe-inline' *and* 'unsafe-eval' are required: the Vite bundle and those
    # third-party widgets inject inline scripts/styles at runtime. Tighten only
    # after verifying checkout in a staging browser — a wrong frame-src or
    # connect-src breaks PayPal with no server-side error.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://www.paypal.com; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.paypal.com https://accounts.google.com; connect-src 'self' https://www.paypal.com https://api-m.paypal.com https://accounts.google.com; frame-src 'self' https://www.paypal.com https://www.google.com; upgrade-insecure-requests" always;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self \"https://www.paypal.com\"), interest-cohort=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}