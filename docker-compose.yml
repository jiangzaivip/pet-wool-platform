services:
  db:
    image: postgres:16-alpine
    container_name: pet_wool_pg
    environment:
      POSTGRES_USER: pet
      POSTGRES_PASSWORD: pet_password
      POSTGRES_DB: pet_wool
    ports:
      - "5432:5432"
    volumes:
      - pet_wool_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet -d pet_wool"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pet_wool_pg_data:
